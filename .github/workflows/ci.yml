name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose
      - run: cargo test --all-features --verbose

  coverage:
    name: Tracey coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install tracey
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/bearcove/tracey/releases/latest/download/tracey-installer.sh | sh
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: tracey query validate
        run: tracey query validate
      - name: Enforce full coverage
        run: |
          set -e
          status=$(tracey query status)
          echo "$status"
          read -r cov_n cov_m < <(printf '%s' "$status" | sed -nE 's|.*: ([0-9]+) of ([0-9]+) requirements are covered.*|\1 \2|p')
          read -r ver_n ver_m < <(printf '%s' "$status" | sed -nE 's|.* ([0-9]+) of ([0-9]+) have a verification reference.*|\1 \2|p')
          echo "covered:  $cov_n / $cov_m"
          echo "verified: $ver_n / $ver_m"
          if [ -z "$cov_n" ] || [ "$cov_n" != "$cov_m" ]; then
            echo "::error::Uncovered requirements exist"
            tracey query uncovered
            exit 1
          fi
          if [ -z "$ver_n" ] || [ "$ver_n" != "$ver_m" ]; then
            echo "::error::Untested requirements exist"
            tracey query untested
            exit 1
          fi
